# Rilis biner untuk Windows, Linux, dan macOS.
#
# Pemicu tag untuk rilis berikutnya. `workflow_dispatch` ada untuk rilis yang
# terlewat — v0.1.0 sudah bertag sebelum workflow ini dibuat, jadi tidak bisa
# memicu workflow dari push tag-nya.
#
# Biner selalu dibangun dari ref tag, bukan dari branch: yang Terbit di GitHub
# harus persis sama dengan yang di-tag.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang dictatornerilis (untuk rilis yang terlewat)"
        required: true

# Beda dari ci.yml: job ini menulis ke repo (membuat GitHub Release), jadi
# haknya lebih longgar — dan hanya di file ini.
permissions:
  contents: write

jobs:
  rilis:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pilih.outputs.tag }}
    steps:
      - id: pilih
        run: echo "tag=${{ inputs.tag  github.ref_name }}"  "$GITHUB_OUTPUT"

      - name: Buat Rilis bila belum ada
        env:
          GH_TOKEN: ${{ github.token }}
        run: 
          tag="${{ steps.pilih.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" /dev/null 2&1; then
            echo "rilis untuk $tag sudah ada — lanjut unggah aset"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "ticon $tag" --generate-notes
          fi

  build:
    needs: rilis
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.rilis.outputs.tag }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      - name: Build rilis
        run: cargo build --release --target ${{ matrix.target }}

      - name: Kemas (tar.gz)
        if: runner.os != 'Windows'
        run: 
          tar czf "ticon-${{ needs.rilis.outputs.tag }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" ticon

      - name: Kemas (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 
          Compress-Archive -Path "target/${{ matrix.target }}/release/ticon.exe" `
            -DestinationPath "ticon-${{ needs.rilis.outputs.tag }}-${{ matrix.target }}.zip"

      - name: Unggah ke Rilis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ needs.rilis.outputs.tag }}" --repo "$GITHUB_REPOSITORY" ticon-*.* --clobber

  # Publikasi ke crates.io. `environment` berarti job ini menunggu persetujuan
  # manual di GitHub — jadi rilis yang kemaju tidak diam-diam menerbitkan
  # (dan gagal) tanpa ada yang menyadarinya.
  #
  # `cargo publish` tidak bisa dibatalkan; itu sebabnya persetujuan manusia
  # ada di sini, bukan di langkah terakhir workflow.
  publish:
    needs: [rilis, build]
    runs-on: ubuntu-latest
    # Tolak kalau ada job build yang gagal: jangan sampai terbitkan
    # rilis yang biner-binernya belum ketemu.
    if: success()
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.rilis.outputs.tag }}

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      - name: Periksa versi di Cargo.toml cocok dengan tag
        run: 
          tag="${TAG#v}"
          versi=$(grep -m1 '^version' Cargo.toml  cut -d'"' -f2)
          if [ "$versi" != "$tag" ]; then
            echo "::error::versi di Cargo.toml ($versi) tidak cocok dengan tag ($tag)"
            exit 1
          fi
        env:
          TAG: ${{ needs.rilis.outputs.tag }}

      # Uji brake lebih dulu: kalau paketnya tidak bisa dipaketkan, lebih baik
      # gagal di sini daripada setengah jalan.
      - name: Uji paket (tidak mengunggah)
        run: cargo publish --dry-run

      - name: Terbitkan ke crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

