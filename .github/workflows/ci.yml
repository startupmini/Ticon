# Gerbang kualitas yang sama dengan yang dijalankan lokal:
#   cargo fmt --check && cargo clippy --all-targets -- -D warnings
#   && cargo test && cargo run -- --audit && cargo build --release
# Test sudah memuat audit pemetaan, tapi dijalankan terpisah juga supaya
# kegagalannya langsung terbaca sebagai langkah "Audit ikon" di UI GitHub.
#
# Dijalankan di Linux DAN Windows karena `src/terminal.rs` memanggil API
# konsol Win32 lewat FFI: kompilator tidak menangkap layout struct yang salah,
# hanya jalannya tes di platform itu yang menangkap.
name: ci

on:
  push:
  pull_request:

# GITHUB_TOKEN hanya dipakai membaca — job ini tidak menulis apa pun,
# jadi haknya dipangkas sejak deklarasi (least privilege).
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Action dipin ke commit SHA, bukan tag/branch yang bergerak:
      # kompromi upstream tidak langsung jadi kode di runner. Dependabot
      # yang memperbarui pin ini.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy (tanpa peringatan)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (termasuk audit pemetaan dan uji e2e)
        run: cargo test

      - name: Audit ikon
        run: cargo run -- --audit

      - name: Build rilis
        run: cargo build --release

  # Menjaga `rust-version` di Cargo.toml tetap jujur: toolchain versi itu
  # harus masih bisa membangun repo ini. Kalau job ini gagal, naikkan
  # `rust-version` (atau turunkan pemakaian API-nya) — jangan diam-diam
  # menaikkan batas minimum tanpa dicatat.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: "1.85"

      - name: Check dengan MSRV
        run: cargo check --all-targets
