# Gerbang kualitas yang sama dengan yang dijalankan lokal:
#   cargo fmt --check && cargo clippy --all-targets -- -D warnings
#   && cargo test && cargo run -- --audit && cargo build --release
# Test sudah memuat audit pemetaan, tapi dijalankan terpisah juga supaya
# kegagalannya langsung terbaca sebagai langkah "Audit ikon" di UI GitHub.
#
# Dijalankan di tiga sistem operasi karena `src/terminal.rs` punya dua jalur
# yang mustahil dicek kompilator: FFI konsol Win32 (layout struct yang salah
# hanya ketahuan saat tes berjalan di Windows) dan ioctl Unix (hanya ketahuan
# saat tes berjalan di Linux/macOS). Ketiganya wajib hijau, bukan hanya satu.
name: ci

on:
  push:
  pull_request:

# GITHUB_TOKEN hanya dipakai membaca — job ini tidak menulis apa pun,
# jadi haknya dipangkas sejak deklarasi (least privilege).
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Action dipin ke commit SHA, bukan tag/branch yang bergerak:
      # kompromi upstream tidak langsung jadi kode di runner. Dependabot
      # yang memperbarui pin ini.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy (tanpa peringatan)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (termasuk audit pemetaan, konformasi, dan uji e2e)
        run: cargo test

      # Resolver TypeScript di examples/ts/ dibandingkan dengan korpus yang sama
      # yang dipakai tes Rust. Ini yang membuat "peta ini benar" bisa dibuktikan
      # di bahasa lain, tanpa `ticon` sebagai dependency runtime.
      - name: Konformasi TypeScript
        if: runner.os == 'Linux'
        run: |
          cargo run --quiet -- --export=json > target/icons.json
          if node --help 2>&1 | grep -q experimental-strip-types; then
            node --experimental-strip-types examples/ts/cek.ts \
              target/icons.json tests/konformasi/nama.txt tests/konformasi/harapan.tsv
          else
            node examples/ts/cek.ts \
              target/icons.json tests/konformasi/nama.txt tests/konformasi/harapan.tsv
          fi

      - name: Audit ikon
        run: cargo run -- --audit

      # Klaim "tidak butuh Nerd Font" dan "satu sel" harus diukur, bukan
      # diasumsikan. Audit ini membaca `shapes` dari data pack dan mengeceknya
      # ke font dasar Windows. Job inilah yang menjaga agar klaim di README
      # tidak bisa lapuk diam-diam — pelajaran dari PR #17, yang sempat
      # mengirim dokumentasi untuk fitur yang belum ada.
      - name: Audit bentuk pack (tidak butuh Nerd Font)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet fonttools
          python tools/audit-pack.py

      # `--sempit` sengaja **tidak** dijalankan untuk semua pack: pack `shape`
      # memang memakai karakter ambiguous-width, dan itu keputusan desainnya.
      # Yang dijaga di sini pack `sempit` saja — namanya menjanjikan, jadi ia
      # wajib benar-benar sempit.
      - name: Audit pack 'sempit' benar-benar sempit
        if: runner.os == 'Windows'
        run: python tools/audit-pack.py --sempit --hanya sempit

      - name: Build rilis
        run: cargo build --release

  # Menjaga `rust-version` di Cargo.toml tetap jujur: toolchain versi itu
  # harus masih bisa membangun repo ini. Kalau job ini gagal, naikkan
  # `rust-version` (atau turunkan pemakaian API-nya) — jangan diam-diam
  # menaikkan batas minimum tanpa dicatat.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: "1.85"

      - name: Check dengan MSRV
        run: cargo check --all-targets
