[package]
name = "ticon"
# Pustaka dan binary satu paket dengan satu nama: `ticon`.
version = "0.4.3"
edition = "2021"
# MSRV 1.85 — bukan karena kode kita butuh itu (`std::iter::repeat_n` sudah
# cukup 1.82), tapi karena `indexmap` (lewat `toml_edit`) memakai manifest
# edition2024 yang butuh Cargo 1.85. Naik hanya setelah dependensi ikut naik;
# job "msrv" di CI menjaga angka ini tetap jujur.
rust-version = "1.85"
# Nama `ikon` sudah dipakai crate lain di crates.io, jadi paket ini memakai
# `ticon`. Dipasang dari GitHub juga bisa:
#   cargo install --git https://github.com/startupmini/Ticon --tag v0.2.0
description = "Ikon minimalis dan flat untuk terminal, plus pustaka pemetaannya"
license = "MIT"
repository = "https://github.com/startupmini/Ticon"
# Pratinjau README (SVG dan font subset render gambar) hanya untuk situs —
# binary maupun pustaka tidak membutuhkannya, jadi jangan ikut paket.
# `assets/raster.ttf` justru ikut: itu input untuk jalur render half-block.
exclude = ["/preview.svg", "/assets/preview/**"]

[lib]
name = "ticon"
path = "src/lib.rs"

[[bin]]
name = "ticon"
path = "src/main.rs"

# Sengaja dijaga sekecil ini. Crate yang menyentuh API Windows lewat
# `windows-sys` memaksa `dlltool` dari toolchain `windows-gnu`, dan itu
# menambah rantai alat hanya untuk satu angka lebar terminal — sudah dihitung
# sendiri di src/terminal.rs.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
