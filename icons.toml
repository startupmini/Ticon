          "yarn.lock", "pnpm-lock.yaml", "composer.json", "composer.lock",
          "go.mod", "go.sum", "requirements.txt", "pyproject.toml", "poetry.lock",
          "gemfile.lock", "flake.lock", "deno.json", "bun.lockb"]
prefix = [".prettierrc", ".eslintrc", ".babelrc", ".stylelintrc"]

[categories.config]
glyph  = "nf-md-cog_outline"
family = "netral"
ext    = [".conf", ".config", ".cfg", ".properties", ".prop", ".rc", ".prefs",
          ".settings", ".editorconfig", ".gitconfig", ".npmrc", ".clang-format", ".tmpl"]
names  = [".editorconfig", ".gitconfig", ".npmrc", ".yarnrc", ".htaccess",
          ".gitkeep", ".mailmap", ".tool-versions", ".nvmrc", ".node-version"]

[categories.secret]
glyph  = "nf-md-shield_key_outline"
family = "aman"
ext    = [".env", ".secret", ".secrets"]
names  = [".env", ".env.local", ".netrc", ".htpasswd", "credentials"]
prefix = [".env."]

[categories.lock]
glyph = "nf-md-lock_outline"
family = "data"
ext   = [".lock", ".lockb", ".lck"]

# ---------------------------------------------------------------------------
