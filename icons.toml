# ===========================================================================
#  ikon — sumber kebenaran tunggal
# ===========================================================================
#
#  Setiap aturan hidup di SATU tempat: bentuk ikon, warna, dan cakupannya ada
#  di blok yang sama. Tidak ada file kembar yang harus dijaga sinkron, jadi
#  tidak ada cara untuk menambah ikon tanpa menambah warnanya.
#
#  Dua prinsip yang ditegakkan mesin, bukan cuma niat:
#
#   1. Hanya glyph dari keluarga `nf-md-` (Material Design Icons). Semuanya
#      digambar di grid 24px yang sama dengan stroke seragam — itulah yang
#      membuat setnya terasa flat. Satu glyph dari keluarga lain merusaknya.
#      Dicek oleh `build.rs`, jadi salah keluarga = gagal compile.
#
#   2. Warna datang dari 16 warna ANSI terminal, maksimum 8 slot. Ikon diberi
#      warna per KATEGORI, bukan per tipe file. Ini yang menahan keramaian:
#      seluruh bahasa pemrograman berbagi satu warna, dan perbedaannya dibawa
#      oleh bentuk ikon (lihat `by_ext` di kategori `code`).
#
#      Karena itu setiap aturan tidak lagi menulis warnanya sendiri: ia
#      menyatakan KELUARGA-nya, dan tabel [families] menerjemahkan keluarga
#      itu menjadi satu warna. Satu keluarga = satu warna, satu warna = satu
#      keluarga — jadi "siapa yang berbagi warna dengan siapa" terbaca dari
#      satu tabel, bukan ditebak dari 64 baris. Yang menegakkan: `cargo test`
#      dan `ikon --audit` (keluarga tak dikenal, dua keluarga berebut warna,
#      warna palet menganggur, tetangga beda keluarga yang sewarna, serta
#      pemakaian `dim` yang melampaui MAX_DIM_RULES).
#
#  Urutan resolusi, dari yang paling spesifik:
#    1. nama folder well-known (bagian [dirs])
#    2. nama file well-known   (field `names`)
#    3. awalan nama            (field `prefix`)
#    4. akhiran nama           (field `suffix`)
#    5. ekstensi terpanjang    (field `ext`, mis. ".tar.gz" menang atas ".gz")
#    6. kategori bawaan: `folder` untuk folder, `file` untuk file
#
#  Semua pencocokan nama tidak peduli huruf besar/kecil. Semua ekstensi
#  ditulis huruf kecil.
# ===========================================================================

[palette]
# Nilai = kode ANSI SGR. Karena memakai warna terminal (bukan truecolor
# hardcoded), palet ini otomatis selaras dengan theme terminal kamu — dan
# otomatis ikut berubah kalau kamu ganti theme.
red     = "31"
green   = "32"
yellow  = "33"
blue    = "34"
magenta = "35"
cyan    = "36"
white   = "37"
dim     = "90"

# ---------------------------------------------------------------------------
#  Keluarga warna
# ---------------------------------------------------------------------------
#
#  Nama kiri = keluarga, nilai = warna dari [palette]. Setiap kategori dan
#  folder khusus di bawah hanya menyebut keluarga; warnanya diturunkan dari
#  tabel ini — inilah satu-satunya tempat keputusan "siapa berbagi warna".
#
#  Yang ditegakkan `cargo test` dan `ikon --audit`:
#    - setiap aturan punya keluarga yang ada di sini,
#    - satu keluarga satu warna dan satu warna satu keluarga,
#    - tidak ada warna palet yang menganggur,
#    - dua aturan yang bersebelahan hanya boleh sewarna kalau satu keluarga,
#    - `dim` maksimal MAX_DIM_RULES aturan (sekarang 9, turun dari 21).
[families]
kode    = "cyan"    # bahasa, kontainer, infra kode, folder sumber
kerja   = "green"   # skrip, uji, tugas
data    = "yellow"  # data terstruktur, arsip, lockfile, paket, citra disk
media   = "magenta" # gaya, gambar, audio, video, model, font
dokumen = "blue"    # folder bawaan + tulisan: catatan, readme, pdf, kantor
aman    = "red"     # rahasia, kunci, sertifikat, jejak vcs
netral  = "white"   # teks polos, konfigurasi, biner — tanpa aksen
redup   = "dim"     # berkas tak dikenal + artefak hasil generate

# ---------------------------------------------------------------------------
#  Folder well-known
# ---------------------------------------------------------------------------
[dirs]
src          = { glyph = "nf-md-code_braces",            family = "kode" }
lib          = { glyph = "nf-md-code_braces",            family = "kode" }
bin          = { glyph = "nf-md-application_outline",    family = "netral" }
test         = { glyph = "nf-md-test_tube",              family = "kerja" }
tests        = { glyph = "nf-md-test_tube",              family = "kerja" }
spec         = { glyph = "nf-md-test_tube",              family = "kerja" }
docs         = { glyph = "nf-md-book_open_page_variant", family = "dokumen" }
doc          = { glyph = "nf-md-book_open_page_variant", family = "dokumen" }
assets        = { glyph = "nf-md-image_outline",         family = "media" }
images        = { glyph = "nf-md-image_outline",         family = "media" }
media        = { glyph = "nf-md-movie_outline",          family = "media" }
examples     = { glyph = "nf-md-code_braces",            family = "kode" }
samples      = { glyph = "nf-md-code_braces",            family = "kode" }
node_modules = { glyph = "nf-md-package_variant_closed", family = "redup" }
vendor       = { glyph = "nf-md-package_variant_closed", family = "redup" }
target       = { glyph = "nf-md-cached",                 family = "redup" }
build        = { glyph = "nf-md-cached",                 family = "redup" }
dist         = { glyph = "nf-md-cached",                 family = "redup" }
out          = { glyph = "nf-md-cached",                 family = "redup" }
".git"       = { glyph = "nf-md-source_branch",          family = "aman" }
".github"    = { glyph = "nf-md-source_branch",          family = "aman" }
".gitlab"    = { glyph = "nf-md-source_branch",          family = "aman" }
".venv"      = { glyph = "nf-md-code_braces",            family = "kode" }
".cargo"     = { glyph = "nf-md-cog_outline",            family = "netral" }
".config"    = { glyph = "nf-md-cog_outline",            family = "netral" }
".cache"     = { glyph = "nf-md-cached",                 family = "redup" }

# ---------------------------------------------------------------------------
#  Bawaan. Ini juga data, bukan hardcode di kode.
# ---------------------------------------------------------------------------
[categories.folder]
glyph = "nf-md-folder_outline"
family = "dokumen"

[categories.file]
glyph = "nf-md-file_outline"
family = "redup"

# ---------------------------------------------------------------------------
#  Kode
# ---------------------------------------------------------------------------

[categories.code]
glyph  = "nf-md-code_braces"
family = "kode"
ext    = [
    ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".mts", ".cts",
    ".py", ".pyi", ".go", ".rs", ".c", ".h", ".cc", ".cpp", ".cxx", ".hpp", ".hh",
    ".cs", ".csx", ".java", ".kt", ".kts", ".scala", ".sc", ".rb", ".php",
    ".swift", ".m", ".mm", ".lua", ".pl", ".pm", ".r", ".jl", ".hs", ".lhs",
    ".ex", ".exs", ".erl", ".hrl", ".clj", ".cljs", ".cljc", ".edn",
    ".dart", ".zig", ".nim", ".v", ".vh", ".groovy", ".gradle", ".fs", ".fsx", ".fsi",
    ".vb", ".vbs", ".asm", ".s", ".cu", ".cuh", ".glsl", ".hlsl", ".vert", ".frag",
    ".wgsl", ".sol", ".move", ".proto", ".f90", ".f95", ".f03", ".cob", ".adb", ".ads",
    ".hx", ".purs", ".elm", ".cr", ".nix", ".gleam", ".odin", ".roc",
]
names  = [
    "makefile", "gnumakefile", "cmakelists.txt", "rakefile", "gemfile",
    "justfile", ".justfile", "procfile", "build.gradle", "settings.gradle",
    "pom.xml", "meson.build", "cargo.toml",
]

# Bentuk berbeda per bahasa, warna tetap SAMA (satu kategori = satu warna).
# Kalau kamu merasa ini masih terlalu ramai, hapus blok ini — hasilnya semua
# file kode tampil dengan satu ikon `nf-md-code_braces` yang sama.
[categories.code.by_ext]
".go"    = "nf-md-language_go"
".rs"    = "nf-md-language_rust"
".py"    = "nf-md-language_python"
".pyi"   = "nf-md-language_python"
".js"    = "nf-md-language_javascript"
".jsx"   = "nf-md-language_javascript"
".mjs"   = "nf-md-language_javascript"
".cjs"   = "nf-md-language_javascript"
".ts"    = "nf-md-language_typescript"
".tsx"   = "nf-md-language_typescript"
".mts"   = "nf-md-language_typescript"
".cts"   = "nf-md-language_typescript"
".java"  = "nf-md-language_java"
".php"   = "nf-md-language_php"
".cs"    = "nf-md-language_csharp"
".rb"    = "nf-md-language_ruby"
".swift" = "nf-md-language_swift"
".kt"    = "nf-md-language_kotlin"
".kts"   = "nf-md-language_kotlin"
".c"     = "nf-md-language_c"
".h"     = "nf-md-language_c"
".cc"    = "nf-md-language_cpp"
".cpp"   = "nf-md-language_cpp"
".cxx"   = "nf-md-language_cpp"
".hpp"   = "nf-md-language_cpp"
".lua"   = "nf-md-language_lua"
".r"     = "nf-md-language_r"
".hs"    = "nf-md-language_haskell"
".lhs"   = "nf-md-language_haskell"

[categories.shell]
glyph  = "nf-md-console_line"
family = "kerja"
ext    = [".sh", ".bash", ".zsh", ".fish", ".ksh", ".csh", ".tcsh", ".nu", ".awk", ".sed",
          ".ps1", ".psm1", ".psd1", ".ps1xml", ".bat", ".cmd"]
names  = [".bashrc", ".zshrc", ".bash_profile", ".bash_aliases", ".profile", ".inputrc", ".vimrc"]
prefix = ["install.", "uninstall."]

[categories.markup]
glyph = "nf-md-language_html5"
family = "data"
ext   = [".html", ".htm", ".xhtml", ".hbs", ".mustache", ".ejs", ".pug", ".haml", ".jinja",
         ".j2", ".njk", ".xml", ".xsl", ".xslt", ".xsd", ".dtd", ".rss", ".atom"]

[categories.markup.by_ext]
".xml"  = "nf-md-xml"
".xsl"  = "nf-md-xml"
".xslt" = "nf-md-xml"
".xsd"  = "nf-md-xml"
".dtd"  = "nf-md-xml"

[categories.style]
glyph = "nf-md-language_css3"
family = "media"
ext   = [".css", ".scss", ".sass", ".less", ".styl", ".pcss", ".postcss"]

# ---------------------------------------------------------------------------
#  Data & konfigurasi
# ---------------------------------------------------------------------------

[categories.data]
glyph  = "nf-md-code_json"
family = "data"
ext    = [".json", ".jsonc", ".json5", ".ndjson", ".geojson", ".webmanifest",
          ".yaml", ".yml", ".toml", ".ini", ".csv", ".tsv", ".psv",
          ".parquet", ".avro", ".orc", ".arrow", ".feather", ".h5", ".hdf5", ".npz", ".npy"]
